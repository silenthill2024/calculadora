name: Deploy GitHub Pages

on:
  push:
    branches: [ main ]

# Permisos necesarios para que GitHub Actions pueda escribir y desplegar en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo permitir un despliegue concurrente a la vez
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v3

      - name: Subir artefacto (Archivos estáticos)
        uses: actions/upload-pages-artifact@v2
        with:
          path: '.' # Toma toda la raíz del proyecto (donde está tu index.html)

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2